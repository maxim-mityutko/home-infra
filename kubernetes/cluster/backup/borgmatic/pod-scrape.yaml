# Victoria Metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  labels:
    app.kubernetes.io/instance: victoria-metrics
  name: borgmatic-metrics
  namespace: backup
spec:
  podMetricsEndpoints:
    - port: health
      scheme: http
      path: /metrics
      scrapeTimeout: 180s
      # Keep the interval longer than the timeout so slow repository queries
      # cannot accumulate overlapping exporter requests during backups.
      interval: 5m
      relabelConfigs:
        - target_label: job
          replacement: borgmatic
  selector:
    matchLabels:
     app.kubernetes.io/name: borgmatic
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: borgmatic-rule
  namespace: backup
spec:
  groups:
  - name: "borgmatic"
    rules:
    - alert: "BorgmaticMissingBackup"
      annotations:
        description: "The instance {{ $labels.instance }} has not created a backup of the repo {{ $labels.repository }} in the last {{ $value }} seconds."
        summary: "Borg missing backup."
      # Allow the daily backup and prune cycle to finish before declaring a miss.
      expr: "time() - sum by (repository) (borg_last_backup_timestamp{job=\"borgmatic\"}) > 93600"
      for: "1m"
      labels:
        severity: "warning"
