apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
configMapGenerator:
  - name: blocky-dashboard
    files:
      # - https://raw.githubusercontent.com/0xERR0R/blocky/v0.35.0/docs/blocky-grafana.json
      # Custom version that supports filtering by client in the Traffic section, but
      # requires Grafana v13.0 or higher.
      - https://raw.githubusercontent.com/maxim-mityutko/blocky/refs/heads/feature/grafana-dashboard-queries-by-client/docs/blocky-grafana.json
generatorOptions:
  labels:
    grafana-dashboard: "true"
