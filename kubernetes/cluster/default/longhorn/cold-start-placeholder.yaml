---
apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-ui-cold-start-placeholder
  namespace: longhorn-system
  labels:
    http.keda.sh/response-body: "true"
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Longhorn is starting</title>
        <style>
          :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fb; color: #172033; --muted: #5d697c; --accent: #dc2626; --edge: #d8e0ea; --panel: #fff; --shadow: rgba(23, 32, 51, 0.12); }
          * { box-sizing: border-box; }
          body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: linear-gradient(180deg, #fbfcff 0%, #eef3f8 100%); }
          main { display: grid; justify-items: center; gap: 1rem; padding: 1.5rem; text-align: center; inline-size: min(100%, 28rem); }
          .drive { width: 7.5rem; height: 5rem; border: 1px solid var(--edge); border-radius: 0.5rem; background: var(--panel); box-shadow: 0 0.8rem 1.6rem var(--shadow); position: relative; animation: pulse 1.8s ease-in-out infinite; }
          .drive::before { content: ""; position: absolute; left: 1rem; right: 1rem; top: 1.1rem; height: 0.55rem; border-radius: 99rem; background: var(--accent); box-shadow: 0 1.15rem 0 #9ca3af, 0 2.3rem 0 #9ca3af; }
          .drive::after { content: ""; position: absolute; right: 0.9rem; bottom: 0.75rem; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #16a34a; }
          h1 { margin: 0; font-size: 1.35rem; line-height: 1.2; font-weight: 800; letter-spacing: 0; }
          p { margin: 0; color: var(--muted); font-size: 0.98rem; line-height: 1.5; }
          @keyframes pulse { 50% { transform: translateY(-0.2rem); } }
          @media (prefers-color-scheme: dark) { :root { color-scheme: dark; background: #0f172a; color: #f8fafc; --muted: #cbd5e1; --edge: #334155; --panel: #182235; --shadow: rgba(0, 0, 0, 0.34); } body { background: linear-gradient(180deg, #111827 0%, #020617 100%); } }
          @media (prefers-reduced-motion: reduce) { .drive { animation: none !important; } }
        </style>
      </head>
      <body>
        <main aria-live="polite">
          <div class="drive" aria-hidden="true"></div>
          <h1>Longhorn is warming up</h1>
          <p>The UI is being started. This page will refresh automatically.</p>
        </main>
      </body>
    </html>
