# NOTES:
# - To uninstall follow: https://longhorn.io/docs/1.12.1/deploy/uninstall/#uninstalling-longhorn-using-argo-cd;
# - If there is an error in defaultSettings, none will be applied, check "Longhorn Manager" pod for logs;
# - For custom storage class: https://longhorn.io/docs/1.12.1/references/storage-class-parameters/
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system
resources:
  - cold-start-placeholder.yaml
  - dns-endpoint.yaml
  - keda-http-interceptor.yaml
  - scaler.yaml
  - storage-class.yaml
  # - recurring-job.yaml
  # - service-scrape.yaml
helmCharts:
  - name: longhorn
    namespace: longhorn-system
    releaseName: longhorn
    version: 1.12.1
    repo: https://charts.longhorn.io
    valuesInline:
      global:
        nodeSelector:
          service.brhd.io/allow-longhorn: "true"
      defaultSettings:
        replicaAutoBalance: least-effort
        replicaZoneSoftAntiAffinity: false
        storageOverProvisioningPercentage: 50
        storageMinimalAvailablePercentage: 20
        upgradeChecker: false
        # For Kubernetes configuration, modify the `numberOfReplicas` field in the StorageClass.
        defaultReplicaCount: 2
        autoDeletePodWhenVolumeDetachedUnexpectedly: true
        detachManuallyAttachedVolumesWhenCordoned: true
        disableSchedulingOnCordonedNode: true
        orphanAutoDeletion: false
        nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
        # Risk: this permits drains even when the node has the last healthy replica.
        # Removing or losing that node after drain can cause data loss, and a running
        # last replica can be corrupted during the drain. Keep this only for manual,
        # closely supervised maintenance windows.
        nodeDrainPolicy: always-allow
        csiAllowedTopologyKeys: topology.kubernetes.io/zone
        logLevel: Warning
        deletingConfirmationFlag: true
        allowCollectingLonghornUsageMetrics: false
        recurringSuccessfulJobsHistoryLimit: 7
        recurringFailedJobsHistoryLimit: 7
        recurringJobMaxRetention: 14
        snapshotMaxCount: 14
        systemManagedComponentsNodeSelector: service.brhd.io/allow-longhorn:true
      defaultBackupStore:
        backupTarget: nfs://nas.brhd.io:/mnt/spin/backup/longhorn
      persistence:
        defaultClass: false
        defaultFsType: ext4
        defaultClassReplicaCount: 2
        reclaimPolicy: Delete   # or "Retain"
        nfsOptions: vers=4.1
      preUpgradeChecker:
        jobEnabled: false
        upgradeVersionCheck: false
      csi:
        # This should be changed specifically for Microk8s
        kubeletRootDir: /var/snap/microk8s/common/var/lib/kubelet 
        attacherReplicaCount: 1 # Handles CSI volume attach/detach operations.
        provisionerReplicaCount: 1 # Creates/deletes PVs for Longhorn-backed PVCs.
        resizerReplicaCount: 1 # Expands volumes after PVC size increases.
        snapshotterReplicaCount: 1 # Serves CSI snapshot create/delete requests.
      longhornUI:
        replicas: 0
      longhornManager:
        updateStrategy:
          rollingUpdate:
            maxUnavailable: "1"
      metrics:
        serviceMonitor:
          enabled: false
      # Disabling and replacing with standalone ingress config because annotations are not applied
      ingress:
        enabled: true
        host: longhorn.brhd.io
        path: /
        annotations:
          kubernetes.io/ingress.class: public
          cert-manager.io/cluster-issuer: lets-encrypt
          nginx.ingress.kubernetes.io/auth-response-headers: >-
            Set-Cookie
          nginx.ingress.kubernetes.io/auth-signin: >-
            https://longhorn.brhd.io/outpost.goauthentik.io/start?rd=$escaped_request_uri
          nginx.ingress.kubernetes.io/auth-snippet: |
            proxy_set_header X-Forwarded-Host $http_host;
          nginx.ingress.kubernetes.io/auth-url: >-
            http://authentik-outpost-embedded.default.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx
      openshift:
        enabled: false
patches:
  - target:
      kind: Ingress
      name: longhorn-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/name
        value: keda-http-interceptor
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/port/number
        value: 8080
