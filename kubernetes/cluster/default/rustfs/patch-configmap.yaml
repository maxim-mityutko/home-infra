apiVersion: v1
kind: ConfigMap
metadata:
  name: rustfs-config
  namespace: rustfs
data:
  RUSTFS_ENABLE_HEAL: 'false'
  RUSTFS_ENABLE_SCANNER: 'false'
  RUSTFS_IDENTITY_OPENID_CONFIG_URL_AUTHENTIK: https://auth.brhd.io/application/o/rust-fs/.well-known/openid-configuration
  RUSTFS_IDENTITY_OPENID_SCOPES_AUTHENTIK: openid,profile,email,rustfs
  RUSTFS_IDENTITY_OPENID_DISPLAY_NAME_AUTHENTIK: Authentik
  RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM_AUTHENTIK: rustfs_groups
  RUSTFS_IDENTITY_OPENID_EMAIL_CLAIM_AUTHENTIK: email
  RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM_AUTHENTIK: email
  RUSTFS_OUTBOUND_ALLOW_ORIGINS: https://auth.brhd.io
