apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: tailscale-ha-proxy
spec:
  statefulSet:
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              tailscale.com/parent-resource: tailscale-ha-router
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              tailscale.com/parent-resource: tailscale-ha-router
