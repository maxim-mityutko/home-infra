apiVersion: v1
kind: ConfigMap
metadata:
  name: mazanoke-cold-start-placeholder
  namespace: extras
  labels:
    http.keda.sh/response-body: "true"
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="refresh" content="5">
        <title>Mazanoke is starting</title>
      </head>
      <body>
        <main>
          <h1>Mazanoke is warming up</h1>
          <p>The service is being started. This page refreshes automatically.</p>
        </main>
      </body>
    </html>
