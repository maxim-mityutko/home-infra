apiVersion: v1
kind: ConfigMap
metadata:
  name: mazanoke-cold-start-placeholder
  namespace: extras
  labels:
    http.keda.sh/response-body: "true"
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mazanoke is starting</title>
        <style>
          :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f7fb; color: #172033; --page-start: #f9fbff; --page-end: #edf3fa; --panel: #fff; --edge: #d6e0ec; --muted: #5c6b7d; --accent: #e76f51; --accent-soft: #fde2d9; --sun: #f4b942; --shadow: rgba(23, 32, 51, 0.14); }
          * { box-sizing: border-box; }
          body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 32rem), linear-gradient(180deg, var(--page-start) 0%, var(--page-end) 100%); }
          main { display: grid; justify-items: center; gap: 1.15rem; padding: 1.5rem; text-align: center; inline-size: min(100%, 28rem); }
          .scene { position: relative; width: 9rem; height: 8rem; display: grid; place-items: center; }
          .picture { width: 6.8rem; height: 5.3rem; border: 1px solid var(--edge); border-radius: 0.75rem; background: var(--panel); box-shadow: 0 1.25rem 2.5rem var(--shadow); padding: 0.55rem; position: relative; overflow: hidden; transform: rotate(-3deg); }
          .picture::before { content: ""; position: absolute; inset: 0.55rem; border-radius: 0.4rem; background: linear-gradient(145deg, #b8dded 0 42%, #9dc9a5 42% 64%, #5f9b76 64%); }
          .picture::after { content: ""; position: absolute; width: 1.15rem; height: 1.15rem; top: 0.95rem; right: 1.05rem; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 0.28rem color-mix(in srgb, var(--sun) 18%, transparent); animation: sun-pulse 1.8s ease-in-out infinite; }
          .frame { position: absolute; width: 4.4rem; height: 3.35rem; border: 0.3rem solid var(--accent); border-radius: 0.45rem; transform: translate(2.1rem, 1.6rem) rotate(8deg); animation: crop 2.2s ease-in-out infinite; }
          .frame::before, .frame::after { content: ""; position: absolute; background: var(--accent); }
          .frame::before { width: 0.7rem; height: 0.18rem; left: -0.5rem; top: -0.3rem; box-shadow: 4rem 3.5rem 0 var(--accent); }
          .frame::after { width: 0.18rem; height: 0.7rem; left: -0.3rem; top: -0.5rem; box-shadow: 3.5rem 4rem 0 var(--accent); }
          h1 { margin: 0; font-size: 1.35rem; line-height: 1.2; font-weight: 800; letter-spacing: 0; }
          p { margin: 0; color: var(--muted); font-size: 0.98rem; line-height: 1.5; }
          @keyframes sun-pulse { 50% { transform: scale(1.14); opacity: 0.68; } }
          @keyframes crop { 50% { transform: translate(1.75rem, 1.25rem) rotate(4deg); } }
          @media (prefers-color-scheme: dark) { :root { color-scheme: dark; background: #141923; color: #eff5ff; --page-start: #202b3b; --page-end: #0b111a; --panel: #192434; --edge: #34465d; --muted: #afbed0; --accent: #ff9a7d; --accent-soft: #633a35; --sun: #ffd36d; --shadow: rgba(0, 0, 0, 0.34); } .picture::before { background: linear-gradient(145deg, #31586b 0 42%, #466c4e 42% 64%, #254c38 64%); } }
          @media (prefers-reduced-motion: reduce) { .scene * { animation: none !important; } }
        </style>
      </head>
      <body>
        <main aria-live="polite">
          <div class="scene" aria-hidden="true"><div class="picture"></div><div class="frame"></div></div>
          <h1>Mazanoke is warming up</h1>
          <p>The image optimizer is being started; this page will refresh automatically.</p>
        </main>
      </body>
    </html>
