---
apiVersion: v1
kind: Service
metadata:
  name: snapotter
  namespace: extras
  labels:
    app.kubernetes.io/name: snapotter
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 1349
      targetPort: http
  selector:
    app.kubernetes.io/name: snapotter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapotter
  namespace: extras
  labels:
    app.kubernetes.io/name: snapotter
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: snapotter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snapotter
    spec:
      containers:
        - name: snapotter
          image: snapotter/snapotter:2.2.0
          env:
            - name: REDIS_URL
              value: redis://redis-master.default.svc.cluster.local.:6379
            - name: TRUST_PROXY
              value: loopback,linklocal,uniquelocal
          envFrom:
            - secretRef:
                name: snapotter
          ports:
            - name: http
              containerPort: 1349
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - SETGID
                - SETUID
              drop:
                - ALL
          volumeMounts:
            - name: snapotter-data
              mountPath: /data
      volumes:
        - name: snapotter-data
          persistentVolumeClaim:
            claimName: snapotter-data
