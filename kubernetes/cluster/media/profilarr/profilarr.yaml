---
apiVersion: v1
kind: Service
metadata:
  name: profilarr
  namespace: media
  labels:
    app.kubernetes.io/name: profilarr
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 6868
      targetPort: http
  selector:
    app.kubernetes.io/name: profilarr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profilarr
  namespace: media
  labels:
    app.kubernetes.io/name: profilarr
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: profilarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profilarr
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: profilarr
          image: ghcr.io/dictionarry-hub/profilarr:2.2.0
          env:
            - name: ORIGIN
              value: https://profilarr.brhd.io
            - name: TZ
              value: Europe/Amsterdam
          ports:
            - name: http
              containerPort: 6868
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: profilarr-config
              mountPath: /config
      volumes:
        - name: profilarr-config
          persistentVolumeClaim:
            claimName: profilarr-config
