apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-victorialogs-datasource
  labels:
    grafana_datasource: "1"
data:
  victorialogs.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://vl-single.monitoring.svc.cluster.local.:9428
        editable: false
