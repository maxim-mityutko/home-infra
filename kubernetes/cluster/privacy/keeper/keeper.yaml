---
apiVersion: v1
kind: Service
metadata:
  name: keeper
  namespace: privacy
  labels:
    app.kubernetes.io/name: keeper
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: keeper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper
  namespace: privacy
  labels:
    app.kubernetes.io/name: keeper
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keeper
    spec:
      containers:
        - name: keeper
          image: ghcr.io/ridafkih/keeper-standalone:2.24.1
          ports:
            - name: http
              containerPort: 80
          env:
            - name: BETTER_AUTH_URL
              value: https://keeper.brhd.io
            - name: MCP_PUBLIC_URL
              value: https://keeper.brhd.io/mcp
            - name: BLOCK_PRIVATE_RESOLUTION
              value: "true"
          envFrom:
            - secretRef:
                name: keeper
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: keeper-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: keeper-data
          persistentVolumeClaim:
            claimName: keeper-data
