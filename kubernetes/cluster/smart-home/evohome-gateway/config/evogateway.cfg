[Serial Port]
# ramses_esp publishes the RF gateway transport under RAMSES/GATEWAY/<gateway-id>.
# The wildcard lets ramses_rf discover the single configured gateway.
COM_PORT = mqtt://mqtt.smart-home.svc.cluster.local:1883/RAMSES/GATEWAY/+
COM_BAUD = 115200

[Files]
EVENTS_FILE = /data/events.log
PACKET_LOG_FILE = /data/packet.log
PACKET_LOG_RETENTION_DAYS = 7
LOG_FILE_ROTATE_BYTES = 1000000
SCHEMA_FILE = /data/ramses_rf_schema.json
ALWAYS_SAVE_SCHEMA_ON_SHUTDOWN = True
MAX_SAVE_FILE_COUNT = 9

[MQTT]
MQTT_SERVER = mqtt.smart-home.svc.cluster.local
MQTT_CLIENTID = evohome-gateway
MQTT_PUB_AS_JSON = False
MQTT_PUB_KV_WITH_JSON = True
MQTT_GROUP_BY_ZONE = True
MQTT_LEGACY_TOPIC_STRUCTURE = False
MQTT_ROOT_TOPIC = evohome/gateway
MQTT_CMD_TOPIC = system/_command
MQTT_SYSTEM_SUBTOPIC = system
MQTT_ZONE_UNKNOWN_SUBTOPIC = _zone_unknown
MQTT_ZONES_SUBTOPIC = zones
MQTT_CONTROLLERS_SUBTOPIC = controllers
MQTT_RELAYS_SUBTOPIC = relays
MQTT_DHW_IS_ZONE = True
MQTT_DHW_ZONE_SUBTOPIC = _dhw
HA_DISCOVERY_ENABLED = True
HA_DISCOVERY_PREFIX = homeassistant
HA_DISCOVERY_ID_PREFIX = evohome_gateway
HA_ZONE_CLIMATE_SUFFIX = Heating

[Ramses_rf]
DISABLE_SENDING = False
ENABLE_DISCOVERY = True
ENABLE_EAVESDROP = True
KNOWN_LIST = False

[Watchdog]
MQTT_HEARTBEAT_INTERVAL = 300
RF_WARN_TIMEOUT = 900
RF_RESTART_TIMEOUT = 1800
RF_PROCESS_RESTART_TIMEOUT = 900
RF_EXIT_TIMEOUT = 1800

[Misc]
THIS_GATEWAY_NAME = evohome-gateway
MIN_ROW_LENGTH = 160
MERGE_UNKNOWN_OTB = True
MERGE_UNKNOWN_HGI = True
MERGE_UNKNOWN_CTL = False
USE_LOCAL_TIME = True
LOG_LEVEL = INFO
EVENTS_CONSOLE_OUTPUT = True
EVENTS_LOG_WITH_DEVICE_NAMES = True
