apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smart-home
resources:
  - evohome-gateway.yaml
  - volume.yaml
configMapGenerator:
  - name: evohome-gateway-config
    files:
      - evogateway.cfg=config/evogateway.cfg
  - name: evohome-gateway
    literals:
      - PYTHONPATH=/app/vendor:/app/source
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Amsterdam
