apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evohome-gateway-config
  namespace: smart-home
  labels:
    app.kubernetes.io/name: evohome-gateway
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-subdir
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evohome-gateway-logs
  namespace: smart-home
  labels:
    app.kubernetes.io/name: evohome-gateway
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-subdir
  resources:
    requests:
      storage: 1Gi
