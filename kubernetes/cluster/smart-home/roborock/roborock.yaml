# Service: Roborock Local Server
# Endpoint: api-roborock.brhd.io:555 (HTTPS), :8881 (MQTT/TLS)
# Label: app.kubernetes.io/name: roborock
---
apiVersion: v1
kind: Service
metadata:
  name: roborock-lb
  namespace: smart-home
  annotations:
    metallb.io/address-pool: forge-pool
    metallb.io/loadBalancerIPs: "192.168.12.74"
  labels:
    app.kubernetes.io/name: roborock
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  ports:
    - name: https
      port: 555
      protocol: TCP
      targetPort: https
    - name: mqtt-tls
      port: 8881
      protocol: TCP
      targetPort: mqtt-tls
  selector:
    app.kubernetes.io/name: roborock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roborock
  namespace: smart-home
  labels:
    app.kubernetes.io/name: roborock
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: roborock
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roborock
    spec:
      containers:
        - name: roborock
          image: ghcr.io/python-roborock/local_roborock_server:1.2.1
          ports:
            - name: https
              containerPort: 555
              protocol: TCP
            - name: mqtt-tls
              containerPort: 8881
              protocol: TCP
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 8
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: roborock-config
              mountPath: /app/config.toml
              subPath: config.toml
              readOnly: true
            - name: roborock-data
              mountPath: /data
            - name: roborock-tls
              mountPath: /run/tls
              readOnly: true
      volumes:
        - name: roborock-config
          secret:
            secretName: roborock
        - name: roborock-data
          persistentVolumeClaim:
            claimName: roborock-data
        - name: roborock-tls
          secret:
            secretName: roborock-tls
